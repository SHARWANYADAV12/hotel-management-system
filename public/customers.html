<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customers - Hotel Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">🏨</div>

            <div>
                <h2>Grand Stay</h2>
                <span>Hotel Management</span>
            </div>
        </div>


        <nav>

            <a href="index.html" class="nav-link">
                <span>📊</span>
                Dashboard
            </a>

            <a href="customers.html" class="nav-link active">
                <span>👥</span>
                Customers
            </a>

            <a href="rooms.html" class="nav-link">
                <span>🛏️</span>
                Rooms
            </a>

            <a href="bookings.html" class="nav-link">
                <span>📅</span>
                Bookings
            </a>

            <a href="payments.html" class="nav-link">
                <span>💳</span>
                Payments
            </a>

            <a href="reports.html" class="nav-link">
                <span>📈</span>
                Reports
            </a>

        </nav>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">

        <!-- HEADER -->

        <header class="topbar">

            <div>
                <h1>Customers</h1>

                <p>
                    Manage hotel customers
                </p>
            </div>

            <button
                class="primary-btn"
                onclick="openCustomerForm()">

                + Add Customer

            </button>

        </header>


        <!-- CUSTOMER FORM -->

        <section
            id="customerForm"
            class="panel form-panel"
            style="display: none; margin-bottom: 25px;">

            <div class="panel-header">

                <div>

                    <h2 id="formTitle">
                        Add Customer
                    </h2>

                    <p>
                        Enter customer information
                    </p>

                </div>

            </div>


            <form id="customerFormElement">

                <input
                    type="hidden"
                    id="customerId">


                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter full name"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Phone
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Address
                        </label>

                        <input
                            type="text"
                            id="address"
                            placeholder="Enter address">

                    </div>

                </div>


                <div class="form-buttons">

                    <button
                        type="submit"
                        class="primary-btn">

                        Save Customer

                    </button>


                    <button
                        type="button"
                        class="secondary-btn"
                        onclick="closeCustomerForm()">

                        Cancel

                    </button>

                </div>

            </form>

        </section>


        <!-- CUSTOMER TABLE -->

        <section class="panel">

            <div class="panel-header">

                <div>

                    <h2>Customer List</h2>

                    <p>
                        All registered hotel customers
                    </p>

                </div>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Phone</th>

                            <th>Address</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="customerTable">

                        <tr>

                            <td
                                colspan="6"
                                class="loading">

                                Loading customers...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="js/customers.js"></script>

</body>
</html>
