<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payments - Hotel Management System</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                🏨
            </div>

            <div>

                <h2>Grand Stay</h2>

                <span>
                    Hotel Management
                </span>

            </div>

        </div>


        <nav>

            <a href="index.html" class="nav-link">
                📊 Dashboard
            </a>

            <a href="customers.html" class="nav-link">
                👥 Customers
            </a>

            <a href="rooms.html" class="nav-link">
                🛏️ Rooms
            </a>

            <a href="bookings.html" class="nav-link">
                📅 Bookings
            </a>

            <a href="payments.html" class="nav-link active">
                💳 Payments
            </a>

            <a href="reports.html" class="nav-link">
                📈 Reports
            </a>

        </nav>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>
                    Payments
                </h1>

                <p>
                    Manage customer payments
                </p>

            </div>

        </header>


        <!-- PAYMENT FORM -->

        <section class="panel"
                 style="margin-bottom:25px;">

            <div class="panel-header">

                <div>

                    <h2>
                        Record Payment
                    </h2>

                    <p>
                        Add payment for a booking
                    </p>

                </div>

            </div>


            <form id="paymentForm">

                <div class="form-grid">


                    <div class="form-group">

                        <label>
                            Booking
                        </label>

                        <select
                            id="booking_id"
                            required>

                            <option value="">
                                Select booking
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Amount
                        </label>

                        <input
                            type="number"
                            id="amount"
                            min="1"
                            placeholder="Enter amount"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Payment Method
                        </label>

                        <select
                            id="payment_method"
                            required>

                            <option value="">
                                Select method
                            </option>

                            <option value="Cash">
                                Cash
                            </option>

                            <option value="UPI">
                                UPI
                            </option>

                            <option value="Card">
                                Card
                            </option>

                            <option value="Cash">
    Cash
</option>

<option value="UPI">
    UPI
</option>

<option value="Card">
    Card
</option>

                        </select>

                    </div>

                </div>


                <button
                    type="submit"
                    class="primary-btn">

                    Record Payment

                </button>

            </form>

        </section>


        <!-- PAYMENT TABLE -->

        <section class="panel">

            <div class="panel-header">

                <div>

                    <h2>
                        Payment History
                    </h2>

                    <p>
                        All recorded payments
                    </p>

                </div>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Customer
                            </th>

                            <th>
                                Room
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Method
                            </th>

                            <th>
                                Date
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <tbody id="paymentTable">

                        <tr>

                            <td colspan="7"
                                class="loading">

                                Loading payments...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="js/payments.js"></script>

</body>

</html>
