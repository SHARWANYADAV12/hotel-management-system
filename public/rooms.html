<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rooms - Hotel Management System</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                🏨
            </div>

            <div>

                <h2>Grand Stay</h2>

                <span>
                    Hotel Management
                </span>

            </div>

        </div>


        <nav>

            <a href="index.html"
               class="nav-link">

                📊 Dashboard

            </a>


            <a href="customers.html"
               class="nav-link">

                👥 Customers

            </a>


            <a href="rooms.html"
               class="nav-link active">

                🛏️ Rooms

            </a>


            <a href="bookings.html"
               class="nav-link">

                📅 Bookings

            </a>


            <a href="payments.html"
               class="nav-link">

                💳 Payments

            </a>


            <a href="reports.html"
               class="nav-link">

                📈 Reports

            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main-content">


        <header class="topbar">

            <div>

                <h1>
                    Rooms
                </h1>

                <p>
                    Manage hotel rooms
                </p>

            </div>


            <button
                class="primary-btn"
                onclick="openRoomForm()">

                + Add Room

            </button>

        </header>


        <!-- FORM -->

        <section
            id="roomForm"
            class="panel form-panel"
            style="display:none; margin-bottom:25px;">


            <div class="panel-header">

                <div>

                    <h2 id="roomFormTitle">
                        Add Room
                    </h2>

                    <p>
                        Enter room information
                    </p>

                </div>

            </div>


            <form id="roomFormElement">


                <div class="form-grid">


                    <div class="form-group">

                        <label>
                            Room Number
                        </label>

                        <input
                            type="text"
                            id="room_number"
                            placeholder="Example: 106"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Room Type
                        </label>

                        <select
                            id="room_type"
                            required>

                            <option value="">
                                Select room type
                            </option>

                            <option value="Single">
                                Single
                            </option>

                            <option value="Double">
                                Double
                            </option>

                            <option value="Deluxe">
                                Deluxe
                            </option>

                            <option value="Suite">
                                Suite
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Price per Night
                        </label>

                        <input
                            type="number"
                            id="price"
                            placeholder="1500"
                            min="1"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Status
                        </label>

                        <select id="status">

                            <option value="Available">
                                Available
                            </option>

                            <option value="Occupied">
                                Occupied
                            </option>

                            <option value="Maintenance">
                                Maintenance
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-buttons">

                    <button
                        type="submit"
                        class="primary-btn">

                        Save Room

                    </button>


                    <button
                        type="button"
                        class="secondary-btn"
                        onclick="closeRoomForm()">

                        Cancel

                    </button>

                </div>

            </form>

        </section>


        <!-- ROOM TABLE -->

        <section class="panel">

            <div class="panel-header">

                <div>

                    <h2>
                        Room List
                    </h2>

                    <p>
                        All hotel rooms
                    </p>

                </div>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Room
                            </th>

                            <th>
                                Type
                            </th>

                            <th>
                                Price / Night
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="roomTable">

                        <tr>

                            <td colspan="6"
                                class="loading">

                                Loading rooms...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="js/rooms.js"></script>

</body>

</html>
