<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reports - Hotel Management System</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                🏨
            </div>

            <div>

                <h2>Grand Stay</h2>

                <span>
                    Hotel Management
                </span>

            </div>

        </div>


        <nav>

            <a href="index.html" class="nav-link">
                📊 Dashboard
            </a>

            <a href="customers.html" class="nav-link">
                👥 Customers
            </a>

            <a href="rooms.html" class="nav-link">
                🛏️ Rooms
            </a>

            <a href="bookings.html" class="nav-link">
                📅 Bookings
            </a>

            <a href="payments.html" class="nav-link">
                💳 Payments
            </a>

            <a href="reports.html" class="nav-link active">
                📈 Reports
            </a>

        </nav>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>
                    Reports
                </h1>

                <p>
                    Hotel performance overview
                </p>

            </div>

        </header>


        <!-- STATISTICS -->

        <section class="stats-grid">


            <div class="stat-card">

                <div class="stat-icon">
                    💰
                </div>

                <div>

                    <span>
                        Total Revenue
                    </span>

                    <h2 id="totalRevenue">
                        ₹0
                    </h2>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    📅
                </div>

                <div>

                    <span>
                        Total Bookings
                    </span>

                    <h2 id="totalBookings">
                        0
                    </h2>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    👥
                </div>

                <div>

                    <span>
                        Total Customers
                    </span>

                    <h2 id="totalCustomers">
                        0
                    </h2>

                </div>

            </div>

        </section>


        <!-- ROOM REPORT -->

        <section class="panel">

            <div class="panel-header">

                <div>

                    <h2>
                        Room Status Report
                    </h2>

                    <p>
                        Current room availability
                    </p>

                </div>

            </div>


            <div
                id="roomReport"
                class="room-report">

                Loading...

            </div>

        </section>

    </main>


    <script src="js/reports.js"></script>

</body>

</html>
